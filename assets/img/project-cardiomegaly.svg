<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750"
     role="img" aria-label="Abstract wireframe preview of a chest X-ray classification interface">
  <defs>
    <linearGradient id="p2bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1119"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>
    <linearGradient id="p2accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="p2glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity=".02"/>
    </linearGradient>
    <radialGradient id="p2slot" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#94b0d6" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#94b0d6" stop-opacity=".03"/>
    </radialGradient>
    <pattern id="p2grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#94b0d6" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#p2bg)"/>
  <rect width="1200" height="750" fill="url(#p2grid)"/>
  <ellipse cx="880" cy="140" rx="400" ry="240" fill="#6366f1" opacity=".05"/>

  <!-- window chrome -->
  <rect x="28" y="28" width="1144" height="694" rx="18" fill="#0a1018" stroke="#94b0d6" stroke-opacity=".16"/>
  <path d="M28 88h1144" stroke="#94b0d6" stroke-opacity=".16"/>
  <circle cx="62" cy="58" r="6" fill="#ff5f57" fill-opacity=".5"/>
  <circle cx="86" cy="58" r="6" fill="#febc2e" fill-opacity=".45"/>
  <circle cx="110" cy="58" r="6" fill="#28c840" fill-opacity=".45"/>
  <rect x="470" y="46" width="300" height="24" rx="12" fill="#94b0d6" fill-opacity=".09"/>
  <rect x="500" y="55" width="164" height="7" rx="3.5" fill="#94b0d6" fill-opacity=".22"/>

  <!-- app header -->
  <g transform="translate(56 112)">
    <rect width="34" height="34" rx="9" fill="#818cf8" fill-opacity=".18" stroke="#818cf8" stroke-opacity=".5"/>
    <circle cx="17" cy="17" r="6.5" fill="none" stroke="#c7cbf5" stroke-width="1.7"/>
    <circle cx="17" cy="17" r="2.4" fill="#c7cbf5" fill-opacity=".8"/>
    <rect x="48" y="9" width="168" height="10" rx="5" fill="#c9d9ee" fill-opacity=".5"/>
    <rect x="48" y="24" width="104" height="7" rx="3.5" fill="#94b0d6" fill-opacity=".3"/>
    <rect x="600" y="6" width="112" height="24" rx="7" fill="url(#p2accent)" fill-opacity=".18" stroke="#38bdf8" stroke-opacity=".4"/>
    <rect x="720" y="8" width="88" height="20" rx="6" fill="#94b0d6" fill-opacity=".08"/>
    <rect x="818" y="8" width="72" height="20" rx="6" fill="#94b0d6" fill-opacity=".08"/>
  </g>

  <!-- upload / image slot -->
  <g transform="translate(56 176)">
    <rect width="540" height="470" rx="16" fill="#0c121c" stroke="#94b0d6" stroke-opacity=".14"/>
    <rect x="24" y="24" width="492" height="290" rx="12" fill="url(#p2slot)" stroke="#94b0d6" stroke-opacity=".2" stroke-dasharray="7 7"/>

    <!-- abstract image glyph -->
    <g opacity=".5" transform="translate(196 100)">
      <rect width="148" height="140" rx="10" fill="none" stroke="#9fdcfb" stroke-opacity=".5" stroke-width="2.5"/>
      <circle cx="46" cy="44" r="15" fill="#9fdcfb" fill-opacity=".3"/>
      <path d="M14 116 L56 72 L88 102 L112 78 L136 116 Z" fill="#9fdcfb" fill-opacity=".22"/>
    </g>
    <g transform="translate(240 268)" opacity=".8">
      <circle cx="0" cy="0" r="16" fill="#38bdf8" fill-opacity=".18"/>
      <path d="M-7 -2 v8 M0 -8 v14 M7 -4 v10" stroke="#9fdcfb" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M22 -4 a10 10 0 0 1 20 0 v6 a10 10 0 0 1 -20 0 Z" fill="none" stroke="#9fdcfb" stroke-width="2" stroke-linecap="round"/>
    </g>

    <rect x="24" y="336" width="240" height="10" rx="5" fill="#c9d9ee" fill-opacity=".4"/>
    <rect x="24" y="360" width="400" height="8" rx="4" fill="#94b0d6" fill-opacity=".26"/>

    <rect x="24" y="396" width="196" height="44" rx="9" fill="url(#p2accent)" fill-opacity=".2" stroke="#38bdf8" stroke-opacity=".45"/>
    <rect x="72" y="414" width="100" height="9" rx="4.5" fill="#c9d9ee" fill-opacity=".6"/>
    <rect x="236" y="396" width="176" height="44" rx="9" fill="#94b0d6" fill-opacity=".06" stroke="#94b0d6" stroke-opacity=".16"/>
    <rect x="288" y="414" width="72" height="9" rx="4.5" fill="#94b0d6" fill-opacity=".3"/>

    <rect x="440" y="398" width="76" height="40" rx="9" fill="#94b0d6" fill-opacity=".05"/>
    <g opacity=".55">
      <rect x="458" y="410" width="40" height="5" rx="2.5" fill="#94b0d6"/>
      <rect x="458" y="420" width="30" height="5" rx="2.5" fill="#94b0d6"/>
      <rect x="458" y="430" width="35" height="5" rx="2.5" fill="#94b0d6"/>
    </g>
  </g>

  <!-- result panel -->
  <g transform="translate(620 176)">
    <rect width="524" height="470" rx="16" fill="#0c121c" stroke="#94b0d6" stroke-opacity=".14"/>

    <rect x="28" y="28" width="140" height="10" rx="5" fill="#c9d9ee" fill-opacity=".4"/>

    <!-- classification classes -->
    <g transform="translate(28 60)">
      <rect width="468" height="58" rx="10" fill="#94b0d6" fill-opacity=".05" stroke="#94b0d6" stroke-opacity=".14"/>
      <rect x="18" y="20" width="18" height="18" rx="5" fill="none" stroke="#9fdcfb" stroke-opacity=".55" stroke-width="2"/>
      <path d="m23 29 3 3.4 6-7" stroke="#9fdcfb" stroke-opacity=".75" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="54" y="23" width="104" height="12" rx="6" fill="#c9d9ee" fill-opacity=".55"/>
      <rect x="372" y="21" width="72" height="16" rx="8" fill="#34d399" fill-opacity=".16" stroke="#34d399" stroke-opacity=".4"/>
    </g>

    <g transform="translate(28 130)">
      <rect width="468" height="58" rx="10" fill="url(#p2glow)" stroke="#38bdf8" stroke-opacity=".5"/>
      <rect x="18" y="20" width="18" height="18" rx="5" fill="#38bdf8" fill-opacity=".25" stroke="#7dd3fc" stroke-opacity=".7" stroke-width="2"/>
      <rect x="23" y="25" width="8" height="8" rx="2" fill="#bfe6fb"/>
      <rect x="54" y="23" width="150" height="12" rx="6" fill="#dbeafe" fill-opacity=".7"/>
      <rect x="366" y="21" width="78" height="16" rx="8" fill="#38bdf8" fill-opacity=".26" stroke="#38bdf8" stroke-opacity=".55"/>
    </g>

    <!-- summary card -->
    <g transform="translate(28 204)">
      <rect width="468" height="112" rx="12" fill="#94b0d6" fill-opacity=".04" stroke="#94b0d6" stroke-opacity=".12"/>
      <rect x="24" y="26" width="120" height="9" rx="4.5" fill="#c9d9ee" fill-opacity=".35"/>
      <rect x="24" y="50" width="200" height="8" rx="4" fill="#94b0d6" fill-opacity=".24"/>
      <rect x="24" y="72" width="160" height="8" rx="4" fill="#94b0d6" fill-opacity=".18"/>
      <path d="M300 84 L336 66 L372 74 L408 46 L440 56" fill="none" stroke="#38bdf8" stroke-opacity=".6" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="408" cy="46" r="4" fill="#0a1018" stroke="#7dd3fc" stroke-width="2"/>
    </g>

    <!-- disclaimer -->
    <g transform="translate(28 332)">
      <rect width="468" height="86" rx="10" fill="#94b0d6" fill-opacity=".03"/>
      <rect y="14" width="2" height="58" rx="1" fill="#94b0d6" fill-opacity=".35"/>
      <rect x="22" y="22" width="150" height="8" rx="4" fill="#94b0d6" fill-opacity=".32"/>
      <rect x="22" y="42" width="404" height="7" rx="3.5" fill="#94b0d6" fill-opacity=".2"/>
      <rect x="22" y="58" width="330" height="7" rx="3.5" fill="#94b0d6" fill-opacity=".16"/>
    </g>
  </g>

  <g transform="translate(56 690)">
    <rect width="1088" height="1" fill="#94b0d6" fill-opacity=".1"/>
  </g>
</svg>
